# =========================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR ODOO SUBDOMAIN
# Subdomain: odoo.saraswatitutorials.com
# Destination: https://saraswati-tutorials.odoo.com (Hosted SaaS) 
#              or http://127.0.0.1:8069 (Local On-Premises Instance)
# =========================================================================

# Upstream definitions for local/on-premise deployment
upstream odoo_backend {
    server 127.0.0.1:8069;
}

upstream odoo_longpolling {
    server 127.0.0.1:8072;
}

# ---------------------------------------------------------
# 1. HTTP Server - Redirects all traffic to HTTPS (port 443)
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name odoo.saraswatitutorials.com;

    # Certbot / Let's Encrypt automated challenge validation path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------
# 2. HTTPS Server - Primary production reverse proxy configuration
# ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odoo.saraswatitutorials.com;

    # SSL Certificate Paths (managed automatically by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/odoo.saraswatitutorials.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoo.saraswatitutorials.com/privkey.pem;

    # Advanced SSL Hardening (A+ Rated Settings)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Security Headers (HSTS, clickjacking defense, content sniffing prevention)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Production Logging
    access_log /var/log/nginx/odoo.access.log;
    error_log /var/log/nginx/odoo.error.log;

    # Production uploads capacity (e.g. database restoration or documents backup)
    client_max_body_size 100M;

    # Prevent proxy timeouts during heavy database sync or report generation
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # ---------------------------------------------------------
    # ROUTE OPTION A: Default On-Premises/Local Odoo Proxy
    # ---------------------------------------------------------
    
    # Odoo Longpolling handler (crucial for real-time messaging, notifications and chat)
    # location /longpolling {
    #     proxy_pass http://odoo_longpolling;
    #     proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    #     proxy_redirect off;
    # 
    #     # Standard Proxy Headers forwarding
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Main Web Interface Proxy handler
    # location / {
    #     proxy_pass http://odoo_backend;
    #     proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    #     proxy_redirect off;
    # 
    #     # Forward headers to preserve hostnames, schemes and origin IPs
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $host;
    # 
    #     # Prevent HTTPoxy vulnerability
    #     proxy_set_header Proxy "";
    # }

    # ---------------------------------------------------------
    # ROUTE OPTION B: Cloud-hosted Odoo SaaS Proxy (saraswati-tutorials.odoo.com)
    # Uncomment the block below and comment/remove Route Option A if Odoo is SaaS hosted
    # ---------------------------------------------------------
    location / {
        proxy_pass https://saraswati-tutorials.odoo.com;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_redirect off;

        # Odoo SaaS specific custom domain mapping headers
        proxy_set_header Host saraswati-tutorials.odoo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host odoo.saraswatitutorials.com;
        proxy_set_header Proxy "";
    }

    # Performance - Static Content Gzip Compression
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript image/svg+xml;
    gzip on;
}
