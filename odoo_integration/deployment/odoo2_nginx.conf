# =========================================================================
# NGINX REVERSE PROXY CONFIGURATION
# Subdomain  : odoo2.saraswatitutorials.com
# Destination: Self-hosted Odoo on 127.0.0.1:8070 (same VPS — 103.230.157.28)
# Longpolling: 127.0.0.1:8072
# Created    : 2026-08-04
#
# ISOLATION GUARANTEE:
#   This block is a completely separate virtual host.
#   It does NOT touch odoo.saraswatitutorials.com (SaaS) or
#   saraswatitutorials.com (main website) in any way.
# =========================================================================

# ── Upstream: Old self-hosted Odoo web interface ──────────────────────────
upstream odoo2_backend {
    server 127.0.0.1:8070;
    # If the old instance runs multiple workers, add them here:
    # server 127.0.0.1:8073;
}

# ── Upstream: Old self-hosted Odoo longpolling (real-time chat/notify) ────
upstream odoo2_longpolling {
    # Standard Odoo convention: main port + 2 = 8072
    # If your old instance uses a different port, change it here.
    server 127.0.0.1:8072;
}

# =========================================================================
# 1. HTTP Server — Redirect all HTTP traffic to HTTPS
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name odoo2.saraswatitutorials.com;

    # Let's Encrypt / Certbot ACME challenge path (required for SSL provisioning)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Force HTTPS for all other requests
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================================
# 2. HTTPS Server — Primary production reverse proxy
# =========================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odoo2.saraswatitutorials.com;

    # ── SSL Certificates (managed by Let's Encrypt / Certbot) ─────────────
    # These paths are created automatically by: certbot --nginx -d odoo2.saraswatitutorials.com
    ssl_certificate     /etc/letsencrypt/live/odoo2.saraswatitutorials.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoo2.saraswatitutorials.com/privkey.pem;

    # ── SSL Hardening (A+ rated TLS configuration) ────────────────────────
    ssl_session_timeout   1d;
    ssl_session_cache     shared:SSL_odoo2:50m;   # Separate cache namespace from odoo.* config
    ssl_session_tickets   off;
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_ciphers           'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"    always;
    add_header X-Content-Type-Options     "nosniff"       always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "no-referrer-when-downgrade" always;

    # ── Dedicated Log Files (isolated from production Odoo logs) ──────────
    access_log /var/log/nginx/odoo2.access.log;
    error_log  /var/log/nginx/odoo2.error.log;

    # ── Upload Capacity & Proxy Timeout ──────────────────────────────────
    # Allow large database backups / document uploads
    client_max_body_size 100M;

    # Prevent proxy timeouts during long Odoo report generation or DB restore
    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;

    # ── Common Proxy Headers (reused across both location blocks) ─────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Proxy             "";        # Prevent HTTPoxy vulnerability

    # ─────────────────────────────────────────────────────────────────────
    # Route A: Longpolling — MUST come before the root "/" location
    # Handles real-time Odoo notifications, chat, and bus updates
    # ─────────────────────────────────────────────────────────────────────
    location /longpolling {
        proxy_pass http://odoo2_longpolling;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_redirect off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Route B: Main Web Interface — catches all other requests
    # ─────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://odoo2_backend;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_redirect off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Proxy             "";

        # Buffer settings for Odoo responses
        proxy_buffers      16 64k;
        proxy_buffer_size  128k;
    }

    # ── Static Asset Caching (optional performance boost) ─────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://odoo2_backend;
        proxy_cache_valid 200 60m;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript image/svg+xml;
    gzip_min_length 1000;
}
